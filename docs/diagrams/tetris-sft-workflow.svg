<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1590" viewBox="0 0 1400 1590" role="img" aria-labelledby="title desc">
<title id="title">俄罗斯方块微调：从引擎标签到线上对比</title><desc id="desc">首轮 GPU 实验 · 2026-10-16 · Decider v19 · NVIDIA L4 · SFT</desc>
<defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087F72"/></marker>
<marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/></marker>
</defs>
<rect width="1400" height="1590" fill="#FFFFFF"/>
<text x="64" y="65" font-size="34" fill="#172B4D" font-weight="700" text-anchor="start">俄罗斯方块微调：从引擎标签到线上对比</text>
<text x="64" y="105" font-size="20" fill="#53657B" font-weight="400" text-anchor="start">首轮 GPU 实验 · 2026-10-16 · Decider v19 · NVIDIA L4 · SFT</text>
<g class="card">
<rect x="360" y="150" width="600" height="104" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="382" y="184" font-size="23" fill="#2563EB" font-weight="700" text-anchor="start">01  采样局面与模拟候选</text>
<text x="382" y="215" font-size="19" fill="#172B4D" font-weight="400" text-anchor="start">144 个种子，每局最多 40 块；枚举合法落点</text>
<text x="382" y="242" font-size="19" fill="#172B4D" font-weight="400" text-anchor="start">引擎计算消行、空洞、高度、起伏与生成安全性</text>
</g>
<path d="M 660 254 L 660 290" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<g class="card">
<rect x="360" y="290" width="600" height="104" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="382" y="324" font-size="23" fill="#2563EB" font-weight="700" text-anchor="start">02  严格支配标签与独立审计</text>
<text x="382" y="355" font-size="19" fill="#172B4D" font-weight="400" text-anchor="start">六项指标都不差，至少一项更好；共 18,868 题</text>
<text x="382" y="382" font-size="19" fill="#172B4D" font-weight="400" text-anchor="start">重算候选与答案；按种子、棋盘隔离四个分区</text>
</g>
<path d="M 660 394 L 660 422" fill="none" stroke="#2563EB" stroke-width="2"/>
<path d="M 197 422 L 1202 422" fill="none" stroke="#2563EB" stroke-width="2"/>
<path d="M 197 422 L 197 450" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<g class="card">
<rect x="55" y="450" width="285" height="112" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="77" y="484" font-size="23" fill="#2563EB" font-weight="700" text-anchor="start">validation / 验证</text>
<text x="77" y="515" font-size="19" fill="#172B4D" font-weight="400" text-anchor="start">2,120 条</text>
<text x="77" y="542" font-size="19" fill="#172B4D" font-weight="400" text-anchor="start">只用于选择 best</text>
</g>
<path d="M 532 422 L 532 450" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<g class="card">
<rect x="390" y="450" width="285" height="112" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="412" y="484" font-size="23" fill="#2563EB" font-weight="700" text-anchor="start">train / 训练</text>
<text x="412" y="515" font-size="19" fill="#172B4D" font-weight="400" text-anchor="start">12,590 条</text>
<text x="412" y="542" font-size="19" fill="#172B4D" font-weight="400" text-anchor="start">只用于参数更新</text>
</g>
<path d="M 867 422 L 867 450" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<g class="card">
<rect x="725" y="450" width="285" height="112" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="747" y="484" font-size="23" fill="#2563EB" font-weight="700" text-anchor="start">calibration / 校准</text>
<text x="747" y="515" font-size="19" fill="#172B4D" font-weight="400" text-anchor="start">2,090 条</text>
<text x="747" y="542" font-size="19" fill="#172B4D" font-weight="400" text-anchor="start">只用于温度拟合</text>
</g>
<path d="M 1202 422 L 1202 450" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<g class="card">
<rect x="1060" y="450" width="285" height="112" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="1082" y="484" font-size="23" fill="#2563EB" font-weight="700" text-anchor="start">test / 测试</text>
<text x="1082" y="515" font-size="19" fill="#172B4D" font-weight="400" text-anchor="start">2,068 条</text>
<text x="1082" y="542" font-size="19" fill="#172B4D" font-weight="400" text-anchor="start">用于最终效果报告</text>
</g>
<path d="M 532 562 L 532 600" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M 197 562 L 197 794 L 360 794" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M 867 562 L 867 584 L 1040 584 L 1040 938 L 960 938" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M 1202 562 L 1202 1098 L 960 1098" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<g class="card">
<rect x="360" y="600" width="600" height="104" rx="16" fill="#ECFDF5" stroke="#087F72" stroke-width="2"/>
<text x="382" y="634" font-size="23" fill="#087F72" font-weight="700" text-anchor="start">03  GPU 监督微调</text>
<text x="382" y="665" font-size="19" fill="#172B4D" font-weight="400" text-anchor="start">冻结 Qwen 基座；续训已有 LoRA 和 pointer head</text>
<text x="382" y="692" font-size="19" fill="#172B4D" font-weight="400" text-anchor="start">1 epoch · 787 步 · 训练子进程约 64 分钟</text>
</g>
<path d="M 660 704 L 660 748" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<g class="card">
<rect x="360" y="748" width="600" height="92" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="382" y="782" font-size="23" fill="#2563EB" font-weight="700" text-anchor="start">04  验证集选择最佳检查点</text>
<text x="382" y="813" font-size="19" fill="#172B4D" font-weight="400" text-anchor="start">每 200 步及结束时验证；best 为第 787 步</text>
</g>
<path d="M 660 840 L 660 888" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<g class="card">
<rect x="360" y="888" width="600" height="100" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="382" y="922" font-size="23" fill="#2563EB" font-weight="700" text-anchor="start">05  校准 choice 概率</text>
<text x="382" y="953" font-size="19" fill="#172B4D" font-weight="400" text-anchor="start">独立校准集选温度；本轮 T = 1.0</text>
</g>
<path d="M 660 988 L 660 1040" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<g class="card">
<rect x="360" y="1040" width="600" height="116" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="382" y="1074" font-size="23" fill="#2563EB" font-weight="700" text-anchor="start">06  原版与微调版独立测试</text>
<text x="382" y="1105" font-size="19" fill="#172B4D" font-weight="400" text-anchor="start">准确率：60.35% → 99.95%</text>
<text x="382" y="1132" font-size="19" fill="#172B4D" font-weight="400" text-anchor="start">换序并改名后实际落点一致率：35.44% → 99.85%</text>
</g>
<path d="M 660 1156 L 660 1208" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<g class="card">
<rect x="360" y="1208" width="600" height="116" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="382" y="1242" font-size="23" fill="#2563EB" font-weight="700" text-anchor="start">07  完整对局、回放与归档</text>
<text x="382" y="1273" font-size="19" fill="#172B4D" font-weight="400" text-anchor="start">每模型：5 个新种子 × 2 种输入；每局上限 50 块</text>
<text x="382" y="1300" font-size="19" fill="#172B4D" font-weight="400" text-anchor="start">共 20 局、895 次落块；保存模型、报告与校验清单</text>
</g>
<path d="M 660 1324 L 660 1410" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#amber)" stroke-dasharray="9 7"/>
<text x="682" y="1377" font-size="18" fill="#B45309" font-weight="400" text-anchor="start">训练完成后的独立部署</text>
<g class="card">
<rect x="360" y="1410" width="600" height="88" rx="16" fill="#FFFBEB" stroke="#B45309" stroke-width="2" stroke-dasharray="8 6"/>
<text x="382" y="1444" font-size="23" fill="#B45309" font-weight="700" text-anchor="start">08  AWS 保留原版，新增 SFT 版</text>
<text x="382" y="1475" font-size="19" fill="#172B4D" font-weight="400" text-anchor="start">页面可选新旧模型；相同输入格式与方块种子对比</text>
</g>
<text x="64" y="1552" font-size="20" fill="#53657B" font-weight="400" text-anchor="start">图示为已完成实验。统一脚本负责训练与验证，上线部署单独执行。</text>
</svg>
