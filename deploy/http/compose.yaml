services:
  api:
    build:
      context: ../..
      dockerfile: deploy/http/Dockerfile
      target: api
    image: decider-finetune-api:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DECIDER_API_TOKEN: ${DECIDER_API_TOKEN:?Set a random API token of at least 32 characters}
    volumes:
      - ./config:/config:ro
      - ${DECIDER_STORAGE_DIR:-/srv/decider/storage}:/storage
      - ${DECIDER_DATA_DIR:-/srv/decider/data}:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: deploy/http/Dockerfile
      target: gpu
    image: decider-finetune-worker:local
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    environment:
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    volumes:
      - ./config:/config:ro
      - ${DECIDER_STORAGE_DIR:-/srv/decider/storage}:/storage
      - ${DECIDER_DATA_DIR:-/srv/decider/data}:/data:ro
      - ${DECIDER_MODELS_DIR:-/srv/decider/models}:/models:ro
      - ${DECIDER_CACHE_DIR:-/srv/decider/cache}:/home/decider/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
