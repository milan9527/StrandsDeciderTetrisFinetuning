name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q
      - run: uv run ruff check backend finetuning scripts tests finetune.py
      - run: uv run python finetune.py --data examples/choices.jsonl --output artifacts/ci-data-check --validate-only
      - run: uv run python -m scripts.verify_reports
